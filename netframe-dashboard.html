<!-- NetFRAME Operations Center — Phase 1 visual shell (mock data).
     Data model reconciled 2026-07-22 against live cluster.
     Every panel reads from the global DATA object; Phase 2 swaps each
     object's source from mock -> fetch('/api/...'). Render layer unchanged. -->
<style>
  :root{
    --base:#040d14; --panel:#0a1922; --panel2:#08141c; --ink:#cdeef2;
    --dim:#5f8a93; --line:rgba(0,255,240,.16); --line2:rgba(0,255,240,.32);
    --cyan:#00fff0; --green:#00ff9f; --yellow:#fcee0a; --red:#ff2a6d;
    --violet:#7b2fff; --orange:#ff7b00;
    --font-display:'Rajdhani','Oswald','Bahnschrift SemiCondensed','Segoe UI Semibold',sans-serif;
    --font-mono:'Share Tech Mono','JetBrains Mono','DejaVu Sans Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;height:100%;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--font-display)}

  /* fixed pixel-locked stage, auto-scaled to viewport */
  #stage{
    position:relative;width:1920px;height:1080px;flex:0 0 auto;
    transform-origin:top left;background:
      radial-gradient(1200px 700px at 70% -10%, rgba(0,255,240,.06), transparent 60%),
      radial-gradient(900px 600px at 10% 110%, rgba(123,47,255,.07), transparent 60%),
      var(--base);
    color:var(--ink);padding:16px 20px 28px;overflow:hidden;
    display:grid;grid-template-rows:66px 92px 46px auto auto 1fr;row-gap:13px;
  }
  /* CRT scanlines + vignette + scan beam */
  #stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px);
    mix-blend-mode:multiply;opacity:.5}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:61;
    box-shadow:inset 0 0 220px rgba(0,0,0,.7)}
  #beam{position:absolute;left:0;right:0;height:140px;top:-140px;z-index:62;pointer-events:none;
    background:linear-gradient(to bottom, transparent, rgba(0,255,240,.05) 60%, rgba(0,255,240,.10));
    border-bottom:1px solid rgba(0,255,240,.22);animation:sweep 7s linear infinite}
  @keyframes sweep{0%{top:-140px}100%{top:1080px}}
  @media (prefers-reduced-motion:reduce){#beam{display:none}.dot{animation:none!important}}

  /* ---- panel chrome ---- */
  .panel{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);padding:10px 12px;
    clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
  .panel > .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex:0 0 auto}
  .ph .t{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;color:var(--cyan);
    text-transform:uppercase;text-shadow:0 0 10px rgba(0,255,240,.35)}
  .ph .sub{font-family:var(--font-mono);font-size:10px;color:var(--dim);letter-spacing:.1em;margin-left:auto}
  .ph .glyph{width:9px;height:9px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);
    clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  .corner{position:absolute;width:10px;height:10px;border-color:var(--line2);opacity:.8}
  .corner.tl{top:3px;left:3px;border-top:2px solid;border-left:2px solid}
  .corner.br{bottom:3px;right:3px;border-bottom:2px solid;border-right:2px solid}

  /* ---- header ---- */
  #head{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .logo{display:flex;align-items:center;gap:12px}
  .hex{width:42px;height:46px;display:grid;place-items:center;position:relative}
  .hex svg{filter:drop-shadow(0 0 8px rgba(0,255,240,.6))}
  .brand{line-height:1}
  .brand .n{font-size:34px;font-weight:700;letter-spacing:.14em;color:#eafcff;
    text-shadow:0 0 18px rgba(0,255,240,.45)}
  .brand .n b{color:var(--cyan)}
  .brand .s{font-family:var(--font-mono);font-size:11px;letter-spacing:.4em;color:var(--dim);margin-top:3px}
  .hbadges{display:flex;gap:10px;margin-left:8px}
  .badge{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;padding:5px 10px;
    border:1px solid var(--line2);text-transform:uppercase;display:flex;align-items:center;gap:7px}
  .badge.warn{color:var(--yellow);border-color:rgba(252,238,10,.4)}
  .badge.ok{color:var(--green);border-color:rgba(0,255,159,.4)}
  .badge.crit{color:var(--red);border-color:rgba(255,42,109,.55);animation:critpulse 1.1s infinite}
  @keyframes critpulse{0%,100%{box-shadow:0 0 0 rgba(255,42,109,0)}50%{box-shadow:0 0 16px rgba(255,42,109,.65)}}
  .clock{margin-left:auto;text-align:right}
  .clock .tm{font-family:var(--font-mono);font-size:30px;color:#eafcff;letter-spacing:.06em;
    font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(0,255,240,.4)}
  .clock .dt{font-family:var(--font-mono);font-size:11px;color:var(--dim);letter-spacing:.22em}

  /* ---- summary strip ---- */
  #summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
  .kpi{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;justify-content:center;
    clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px))}
  .kpi .lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
  .kpi .val{font-size:38px;font-weight:700;line-height:1.05;color:#eafcff;font-variant-numeric:tabular-nums;
    display:flex;align-items:baseline;gap:6px}
  .kpi .val .u{font-size:14px;color:var(--dim);font-weight:400;font-family:var(--font-mono)}
  .kpi .val .sep{color:var(--dim);font-weight:400}
  .kpi .foot{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-top:2px;letter-spacing:.08em}
  .kpi .edge{position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  /* Phase 3.3 — trend sparkline behind each KPI */
  .kpi .spark2{position:absolute;left:3px;right:0;bottom:0;height:30px;opacity:.55;pointer-events:none;z-index:0}
  .kpi .spark2 svg{width:100%;height:100%;display:block}
  .kpi .lab,.kpi .val,.kpi .foot{position:relative;z-index:1}

  /* ---- monitor integrity ticker ---- */
  #integrity{display:flex;gap:9px;align-items:stretch;min-height:0}
  #integrity .lead{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;padding-right:4px}
  #integrity .lead .t{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;color:var(--cyan);
    text-transform:uppercase;text-shadow:0 0 10px rgba(0,255,240,.35)}
  #integrity .lead .s2{font-family:var(--font-mono);font-size:8px;color:var(--dim);letter-spacing:.1em}
  .ichip{flex:1;min-width:0;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    padding:5px 9px;display:flex;flex-direction:column;justify-content:center;gap:1px;position:relative;
    clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}
  .ichip .il{font-family:var(--font-mono);font-size:8px;letter-spacing:.11em;color:var(--dim);text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ichip .iv{font-family:var(--font-mono);font-size:12px;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .ichip .iv .dot{width:6px;height:6px}

  /* ---- main grid ---- */
  #main{display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:1fr auto auto auto;gap:13px;min-height:0}
  #nodes{grid-column:1;grid-row:1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
  #rail{grid-column:2;grid-row:1 / span 4;display:grid;grid-template-rows:auto 1fr auto auto;gap:11px;min-height:0}
  #slurm{grid-column:1;grid-row:2}
  #gpustrip{grid-column:1;grid-row:3;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  #botband{grid-column:1;grid-row:4;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

  /* node card */
  .node{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);padding:9px 9px 8px;display:flex;flex-direction:column;gap:6px;
    clip-path:polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 0 100%)}
  .node.standalone{border-style:dashed;border-color:rgba(123,47,255,.4);background:
    linear-gradient(180deg,rgba(123,47,255,.06),var(--panel2))}
  /* Phase 3.2 — reactive critical flash */
  .node.crit,.ichip.crit{border-color:var(--red)!important;animation:critpulse 1.1s infinite}
  .node .nh{display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .dot.g{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2.4s infinite}
  .dot.y{background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:pulse 1.3s infinite}
  .dot.r{background:var(--red);box-shadow:0 0 9px var(--red);animation:pulse .9s infinite}
  .dot.v{background:var(--violet);box-shadow:0 0 8px var(--violet)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .node .hn{font-size:17px;font-weight:700;letter-spacing:.04em;color:#eafcff}
  .node .hw{font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:.04em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .role{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;padding:2px 5px;align-self:flex-start;
    border:1px solid var(--line2);color:var(--cyan);text-transform:uppercase}
  .role.st{color:var(--violet);border-color:rgba(123,47,255,.5)}
  .role.stor{color:var(--orange);border-color:rgba(255,123,0,.45)}
  .bar{--c:var(--cyan)}
  .bar .bl{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px;
    color:var(--dim);letter-spacing:.05em;margin-bottom:2px}
  .bar .bl b{color:var(--ink);font-weight:400}
  .bar .track{height:6px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
  .bar .fill{height:100%;background:var(--c);box-shadow:0 0 8px var(--c);transition:width .8s ease}
  .node .vm{font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:.06em;margin-top:auto}
  .node .vm b{color:var(--ink)}
  .gpublk{border-top:1px solid var(--line);margin-top:4px;padding-top:5px}
  .gpublk .gl{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px;color:var(--cyan);letter-spacing:.04em}
  .temps{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
  .temp{font-family:var(--font-mono);font-size:10px;color:var(--ink);display:flex;align-items:center;gap:3px}
  .temp i{width:5px;height:5px;background:var(--orange);box-shadow:0 0 6px var(--orange);border-radius:50%;font-style:normal}

  /* small stat rows */
  .rows{display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .row{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px}
  .row .nm{color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
  .row .hostt{color:var(--dim);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px;flex:0 0 auto}
  .row .st{font-size:10px;letter-spacing:.08em}
  .metric{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;
    padding:3px 0;border-bottom:1px dashed rgba(0,255,240,.08)}
  .metric .k{color:var(--dim);letter-spacing:.06em}
  .metric .v{color:#eafcff;font-variant-numeric:tabular-nums}
  .big{font-size:30px;font-weight:700;color:#eafcff;font-variant-numeric:tabular-nums;line-height:1}
  .mono{font-family:var(--font-mono)}
  .c-cyan{color:var(--cyan)}.c-green{color:var(--green)}.c-yellow{color:var(--yellow)}
  .c-red{color:var(--red)}.c-violet{color:var(--violet)}.c-orange{color:var(--orange)}.c-dim{color:var(--dim)}

  /* ups pair / rail rows of 2 */
  .rail2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

  /* gauge (battery/load) */
  .gauge{display:flex;align-items:center;gap:10px}
  .ring{--p:0;--c:var(--green);width:52px;height:52px;border-radius:50%;flex:0 0 auto;
    background:conic-gradient(var(--c) calc(var(--p)*1%), rgba(255,255,255,.07) 0);
    display:grid;place-items:center;position:relative;filter:drop-shadow(0 0 6px rgba(0,255,240,.25))}
  .ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--panel2)}
  .ring span{position:relative;font-family:var(--font-mono);font-size:12px;color:#eafcff;font-variant-numeric:tabular-nums}

  /* sparkline */
  .spark{display:flex;align-items:flex-end;gap:2px;height:26px}
  .spark i{flex:1;background:linear-gradient(to top,rgba(0,255,240,.25),var(--cyan));font-style:normal;min-height:2px;
    box-shadow:0 0 4px rgba(0,255,240,.4)}
  .wan{display:flex;flex-direction:column;gap:3px}
  .wan .wtop{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:11px}

  /* slurm band */
  #slurm .body{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;min-height:0}
  .qhead{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;color:var(--dim);
    text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:5px;
    display:flex;justify-content:space-between}
  .job{display:grid;grid-template-columns:52px 1fr 74px 60px;gap:8px;font-family:var(--font-mono);font-size:12px;
    padding:4px 0;align-items:center;border-bottom:1px dashed rgba(0,255,240,.07)}
  .job .id{color:var(--dim)}
  .job .usr{font-weight:700;display:flex;align-items:center;gap:6px}
  .job .g{color:var(--cyan)}
  .job .el,.job .rs{color:var(--dim);text-align:right}
  .utag{width:7px;height:7px;border-radius:50%}
  .users{display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
  .uchip{font-family:var(--font-mono);font-size:11px;display:flex;align-items:center;gap:6px;color:var(--ink)}

  #footer{position:absolute;left:20px;right:20px;bottom:7px;display:flex;justify-content:space-between;
    font-family:var(--font-mono);font-size:10px;color:var(--dim);letter-spacing:.14em;z-index:40}

  .plist{display:flex;flex-direction:column;gap:3px}
  .kv2{display:grid;grid-template-columns:1fr auto;font-family:var(--font-mono);font-size:11px;padding:2px 0}
  .kv2 .k{color:var(--dim);letter-spacing:.05em}
  .kv2 .v{color:#eafcff;font-variant-numeric:tabular-nums}
  .segbar{display:flex;height:8px;gap:2px;margin-top:3px}
  .segbar i{flex:1;background:rgba(255,255,255,.06);font-style:normal}
  .segbar i.on{background:var(--green);box-shadow:0 0 6px var(--green)}
  .segbar i.on.c{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
  .pill{font-family:var(--font-mono);font-size:9px;padding:1px 6px;border:1px solid var(--line2);letter-spacing:.08em}
  .offline{display:grid;place-items:center;gap:6px;flex:1;font-family:var(--font-mono);color:var(--dim);
    letter-spacing:.14em;font-size:12px;text-align:center;border:1px dashed rgba(255,255,255,.08);padding:10px}
  .offline .big2{color:var(--yellow);font-size:14px;letter-spacing:.2em}
  .dead{color:var(--red)!important;border-color:rgba(255,42,109,.4)!important}

  /* ---- live incident strip (NFM-INCIDENT) ----
     Bounded on purpose: the operator must see the incident AND the estate at once, so this is a
     full-width strip with a hard max-height, not a takeover. With nothing selected the element is
     display:none and its grid row collapses - the operations wall is unchanged. */
  #incident{display:none}
  #incident.on{display:block}
  .ipanel{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-left:3px solid var(--dim);padding:8px 12px;
    max-height:200px;overflow:hidden;font-size:12px;line-height:1.5}
  .ipanel.crit{border-left-color:var(--red)}
  .ipanel.warn{border-left-color:var(--yellow)}
  .ipanel.dim{border-left-color:var(--dim)}
  .ihead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .ibadge{font-weight:700;letter-spacing:.12em;font-size:11px;padding:1px 7px;
    border:1px solid currentColor;color:var(--dim)}
  .ibadge.crit{color:var(--red)} .ibadge.warn{color:var(--yellow)} .ibadge.dim{color:var(--dim)}
  .iid{font-weight:700;letter-spacing:.04em;color:var(--ink)}
  .iage{margin-left:auto;color:var(--dim);font-size:11px;letter-spacing:.06em}
  .iwarn{color:var(--red);font-size:11px;margin:2px 0 4px;letter-spacing:.03em}
  .irow{display:flex;gap:8px;align-items:flex-start;margin:2px 0}
  .ilab{flex:0 0 132px;color:var(--dim);font-size:10.5px;letter-spacing:.14em;padding-top:2px}
  .ipill{display:inline-block;font-size:10.5px;letter-spacing:.05em;padding:0 6px;
    margin:1px 4px 1px 0;border:1px solid currentColor;color:var(--dim)}
  .ipill.crit{color:var(--red)} .ipill.warn{color:var(--yellow)}
  .ipill.ok{color:var(--green)} .ipill.dim{color:var(--dim)}
  .idim{color:var(--dim);font-size:11px}
  .ictr{display:block;color:var(--dim);font-size:11px;margin-top:1px}
  .ircv{display:block;color:var(--yellow);font-size:11px;margin-top:2px;letter-spacing:.03em}
  .inext{color:var(--ink);font-size:11.5px;margin-right:6px}
  .iauth{color:var(--dim);font-size:10.5px;letter-spacing:.12em;margin-top:4px;text-align:right}

  /* ---- incident proposal awareness (NFM-PROPOSAL) ----
     Deliberately small. With nothing awaiting review the element is display:none and its grid row
     collapses, so the steady state costs the operations wall no space at all. */
  #proposals{display:none}
  #proposals.on{display:block}
  .ppanel{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-left:3px solid var(--dim);padding:6px 12px;
    max-height:132px;overflow:hidden;font-size:11.5px;line-height:1.45}
  .ppanel.warn{border-left-color:var(--yellow)}
  .ppanel.crit{border-left-color:var(--red)}
  .phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pbadge{font-weight:700;letter-spacing:.12em;font-size:10.5px;padding:1px 7px;
    border:1px solid currentColor;color:var(--dim)}
  .pbadge.warn{color:var(--yellow)} .pbadge.crit{color:var(--red)} .pbadge.dim{color:var(--dim)}
  .pcount{font-weight:700;letter-spacing:.06em;color:var(--ink)}
  .pauth{margin-left:auto;color:var(--dim);font-size:10px;letter-spacing:.12em}
  .ppill{display:inline-block;font-size:10px;letter-spacing:.05em;padding:0 6px;
    margin:1px 4px 1px 0;border:1px solid currentColor;color:var(--dim)}
  .ppill.crit{color:var(--red)} .ppill.warn{color:var(--yellow)} .ppill.dim{color:var(--dim)}
  .prow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
  .pid{color:var(--ink);font-weight:700;letter-spacing:.03em}
  .palert{color:var(--ink)}
  .page{margin-left:auto;color:var(--dim);font-size:10px}
  .pdim{color:var(--dim);font-size:10.5px}
  .pnote{color:var(--dim);font-size:10px;letter-spacing:.02em;margin-top:1px}
  .pfoot{color:var(--dim);font-size:10px;letter-spacing:.06em;margin-top:3px}
</style>

<div id="stage">
  <div id="beam"></div>

  <!-- HEADER -->
  <div id="head">
    <div class="logo">
      <div class="hex"><svg width="40" height="44" viewBox="0 0 40 44"><polygon points="20,2 38,12 38,32 20,42 2,32 2,12" fill="none" stroke="#00fff0" stroke-width="2"/><polygon points="20,12 29,17 29,27 20,32 11,27 11,17" fill="#00fff0" fill-opacity="0.15" stroke="#00fff0" stroke-width="1.5"/></svg></div>
      <div class="brand">
        <div class="n">NET<b>FRAME</b></div>
        <div class="s">KM-CLUSTER · OPERATIONS CENTER</div>
      </div>
    </div>
    <div class="hbadges">
      <div class="badge warn" id="modebadge"><span class="dot y"></span>CONNECTING</div>
      <div class="badge ok" id="hstatus"><span class="dot g"></span>ALL SYSTEMS NOMINAL</div>
    </div>
    <div class="clock">
      <div class="tm" id="clk">--:--:--</div>
      <div class="dt" id="cdate">----</div>
    </div>
  </div>

  <!-- SUMMARY -->

/* ---------------- summary ---------------- */
const KPIHIST={};
function sparkSVG(vals){
  if(!vals||vals.length<2) return '';
  const w=100,h=30,n=vals.length;
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>[i/(n-1)*w, h-2-((v-mn)/rng)*(h-5)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const e=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${line} L ${w} ${h} L 0 ${h} Z" fill="#00fff0" fill-opacity="0.14"/>
    <path d="${line}" fill="none" stroke="#00fff0" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
    <circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="1.7" fill="#00fff0"/></svg>`;
}
function renderSummary(){

  const run=DATA.slurm.running.length, pend=DATA.slurm.pending.length;
  const kW=(DATA.power.feeds.reduce((a,f)=>a+f.w,0))/1000;

  ];
  cards.forEach(c=>{const a=KPIHIST[c.k]||(KPIHIST[c.k]=[]);a.push(c.n);while(a.length>60)a.shift();});
  el('summary').innerHTML=cards.map(c=>`<div class="kpi"><div class="edge"></div>
    <div class="spark2">${sparkSVG(KPIHIST[c.k])}</div>
    <div class="lab">${c.lab}</div>
    <div class="val">${c.val}${c.unit?'<span class="u">'+c.unit+'</span>':''}</div>
    <div class="foot">${c.foot}</div></div>`).join('');
}

/* NFM-DISPLAY-STATE-BEGIN  (pure; offline-tested by tests/test_p2_renderer.mjs - keep in sync)
   The wall must show the BACKEND's truth, not "did /api/state answer".
   Historical defect: this returned LIVE whenever the fetch succeeded and the whole-snapshot ts was
   young. serve.py publishes unconditionally, so ts is ALWAYS young - the badge therefore read LIVE
   for a 12d13.7h CT103 outage while the tiles held carried data (operations/wall-monitor-dependency).
   Authoritative fields, in precedence order:
     1. s.ts            whole-snapshot freshness  -> STALE overrides everything stored
     2. s.panels[].state per-panel FRESH/STALE/MISSING/ERROR (the only per-source truth)
     3. s.mode           backend's own derived mode
   s.sources[] is NOT authoritative: carry() sets it true whenever anything was carried.
   Unknown or absent freshness fails toward DEGRADED/UNKNOWN, never toward LIVE. */
/* NFM-SMART-PILLS-BEGIN  (pure; offline-tested by tests/test_p3_smart.mjs - keep in sync)
   "No source, no health claim." The DS4246 SMART pills used to render from a hard-coded literal
   {pass:52,warn:2,fail:0}, so the wall showed a yellow "WARN 2" that no probe had ever produced -
   an operator reasonably read it as two live JBOD warnings. /api/state carries no `smart` object and
   serve.py has no SMART/JBOD/enclosure collector, so the only honest render is UNKNOWN.
   An absent health field is NOT pass, NOT warn and NOT fail - and it is not zero either, because
   "FAIL 0" is itself a measurement claim. Only a valid object carrying all three numeric counts
   renders numbers. The separate live "SMART Trend" integrity chip is fed by netframe-monitor and is
   untouched by this: that one has a real source. */
function nfmSmartPills(smart){
  const num = v => typeof v === 'number' && isFinite(v) && v >= 0;
  const ok = smart && typeof smart === 'object'
             && num(smart.pass) && num(smart.warn) && num(smart.fail);
  if(!ok){
    return '<span class="pill" style="color:var(--dim);border-color:currentColor">SMART NOT MEASURED</span>';
  }
  return '<span class="pill" style="color:var(--green);border-color:currentColor">SMART PASS '+smart.pass+'</span>'
       + '<span class="pill" style="color:'+(smart.warn?'var(--yellow)':'var(--dim)')+';border-color:currentColor">WARN '+smart.warn+'</span>'
       + '<span class="pill" style="color:'+(smart.fail?'var(--red)':'var(--dim)')+';border-color:currentColor">FAIL '+smart.fail+'</span>';
}
/* NFM-SMART-PILLS-END */

/* NFM-WAN-POSTURE-BEGIN  (pure; offline-tested by tests/test_p6_wan.mjs - keep in sync)
   Dual-WAN resilience is FIVE independent facts, and the old footer collapsed them into one:
   `w1on = wan1.gw==='Online'` painted the whole card green whenever Spectrum answered. WAN2 was in
   fact dead for 25 days (2026-08-15 to 2026-09-09) while this footer read "PRIMARY UP · WAN1 ACTIVE"
   in green the entire time. Green there means "we are protected", and we were not.
   The five dimensions, never inferred from one another:
     1. wan1 gateway health        wan1.gw            Online/Offline
     2. wan2 gateway health        wan2.gw            Online/Offline
     3. failover policy armed      failover.armed     a >=2-tier group an ENABLED rule routes through
     4. primary monitor quality    wan1.monitor       external target, not the gateway's own next-hop
     5. active path                failover.active    live pf route-to, not guessed from 1 and 2
   `state` (the INTERFACE being UP) is deliberately NOT a health fallback: WAN2 sat state=UP with
   gw=Offline for weeks, so that fallback is the same conflation this function exists to remove.
   Every unknown fails toward amber. An absent field is UNKNOWN, never false and never true, so a
   broken probe degrades the wall honestly instead of inventing readiness. */
function nfmWanPosture(o){
  var R=function(state,label,sub,color,reason){
    return {state:state,label:label,sub:sub,color:color,reason:reason};
  };
  var AMBER='var(--yellow)', GREEN='var(--green)', RED='var(--red)', DIM='var(--dim)';
  if(!o || typeof o!=='object') return R('UNKNOWN','WAN STATE UNKNOWN','no snapshot',DIM,'no data');

  /* health: gateway status only. null = UNKNOWN. */
  var health=function(w){
    if(!w || typeof w!=='object') return null;
    if(w.gw==='Online') return true;
    if(w.gw==='Offline') return false;
    return null;
  };
  var w1=health(o.wan1), w2=health(o.wan2);

  /* externally monitored: generic, not a hardcoded IP. A monitor equal to the gateway's own address
     only proves the next hop answers; the internet beyond the ISP is unproven. */
  var extMon=function(w){
    if(!w || typeof w!=='object') return null;
    if(typeof w.monitor!=='string' || !w.monitor) return (w.monitor===null||w.monitor===undefined)?null:false;
    if(typeof w.gw_addr==='string' && w.gw_addr && w.monitor===w.gw_addr) return false;
    return true;
  };
  var ext=extMon(o.wan1);

  var fo=(o.failover && typeof o.failover==='object')?o.failover:null;
  var armed=fo?(fo.armed===true?true:(fo.armed===false?false:null)):null;
  var active=fo?(fo.active==='wan1'?'wan1':(fo.active==='wan2'?'wan2':null)):null;

  if(w1===null) return R('UNKNOWN','WAN STATE UNKNOWN','primary health not reported',DIM,'wan1 health unknown');

  if(w1===false){
    if(w2===true && active==='wan2')
      return R('FAILED_OVER','▼ FAILED OVER · WAN2 ACTIVE','FirstNet carrying traffic',AMBER,'wan1 down, pf on wan2');
    if(w2===false)
      return R('NO_INTERNET','▼ NO INTERNET','both WANs down',RED,'wan1 and wan2 down');
    if(w2===true)
      return R('PRIMARY_DOWN_PATH_UNKNOWN','▼ PRIMARY DOWN · PATH UNKNOWN','WAN2 healthy, active path unproven',RED,'wan1 down, active path unknown');
    return R('UNKNOWN','▼ PRIMARY DOWN · STANDBY UNKNOWN','standby health not reported',RED,'wan1 down, wan2 unknown');
  }

  /* wan1 is up from here */
  if(active==='wan2')
    return R('FAILED_OVER','▼ FAILED OVER · WAN2 ACTIVE','FirstNet carrying traffic',AMBER,'pf on wan2 while wan1 up');
  if(w2===false)
    return R('NO_FAILOVER','▲ PRIMARY UP · NO FAILOVER','WAN2 FirstNet offline',AMBER,'wan2 down');
  if(w2===null)
    return R('UNKNOWN','▲ PRIMARY UP · STANDBY UNKNOWN','WAN2 health not reported',AMBER,'wan2 unknown');
  if(armed===false)
    return R('NOT_ARMED','▲ PRIMARY UP · FAILOVER NOT ARMED','no rule routes through a failover group',AMBER,'policy not armed');
  if(ext===false)
    return R('NOT_ARMED','▲ PRIMARY UP · FAILOVER NOT ARMED','primary monitors its own next-hop',AMBER,'primary not externally monitored');
  if(armed===null || ext===null || active===null)
    return R('UNKNOWN','▲ PRIMARY UP · FAILOVER STATE UNKNOWN','resilience not proven this cycle',AMBER,'armed/monitor/active unknown');
  return R('READY','▲ DUAL-WAN READY','WAN1 Spectrum · WAN2 FirstNet standby',GREEN,'all five inputs healthy');
}
/* NFM-WAN-POSTURE-END */

function nfmDisplayState(s, nowSec, bound){
  bound = (typeof bound==='number') ? bound : 90;   // ~2.4 refresh cycles (REFRESH=30s + work)
  const R=(state,age,stale,reason)=>({state:state,age:age,stale:stale||[],reason:reason});
  if(!s || typeof s!=='object')                 return R('OFFLINE', null, [], 'no snapshot');
  const ts=(typeof s.ts==='number' && isFinite(s.ts) && s.ts>0) ? s.ts : null;
  if(ts===null)                                 return R('STALE', null, [], 'snapshot has no timestamp');
  const age=Math.max(0, nowSec-ts);
  if(age>bound)                                 return R('STALE', age, [], 'snapshot age '+Math.round(age)+'s exceeds '+bound+'s');
  const P=(s.panels && typeof s.panels==='object') ? s.panels : null;
  if(!P)                                        return R('UNKNOWN', age, [], 'snapshot carries no per-panel state');
  const names=Object.keys(P).sort(); const bad=[]; let unknown=false;
  for(let i=0;i<names.length;i++){
    const st=P[names[i]] && P[names[i]].state;
    if(st==='FRESH') continue;
    if(st==='STALE'||st==='MISSING'||st==='ERROR') bad.push(names[i]);
    else unknown=true;                          // absent/unrecognised -> pessimistic
  }
  if(!names.length)                             return R('UNKNOWN', age, [], 'no panels reported');
  if(unknown)                                   return R('UNKNOWN', age, bad, 'a panel reported no recognised state');
  if(s.mode==='STALE')                          return R('STALE', age, bad, 'backend mode STALE');
  if(bad.length)                                return R('DEGRADED', age, bad, bad.length+' panel(s) not FRESH');
  if(s.mode==='LIVE')                           return R('LIVE', age, [], 'backend LIVE and every panel FRESH');
  if(s.mode==='DEGRADED'||s.mode==='ERROR')     return R('DEGRADED', age, bad, 'backend mode '+s.mode);
  return R('UNKNOWN', age, bad, 'unrecognised backend mode '+String(s.mode));
}
/* NFM-DISPLAY-STATE-END */

/* Ages a carried panel honestly: serve.py reports panels[].age from the last FRESH observation and
   null when that is unknown. Null must read as UNKNOWN, never as young. */
function nfmAgeText(sec){
  if(sec==null || !isFinite(sec)) return '?';
  if(sec<90) return Math.round(sec)+'s';
  if(sec<5400) return Math.round(sec/60)+'m';
  if(sec<172800) return Math.round(sec/3600)+'h';
  return Math.round(sec/86400)+'d';
}

/* NFM-INCIDENT-PANEL-BEGIN  (pure; offline-tested by tests/test_p4_incident.mjs - keep in sync)
   The wall DISPLAYS Jarvis's reasoning. It does not become Jarvis: nothing here thresholds a
   metric, correlates anything, or decides what an incident means. Every judgement below is about
   PRESENTATION - is this projection current, and does the wording match what the model actually
   says.

   FRESHNESS PRECEDENCE, and it is the whole point:
     1. the FEED's own age            (generated_at)   -> stale here overrides everything inside
     2. the PROJECTION's age          (state_generated_at, preserved across a failed producer run)
     3. the LiveIncidentState cycle   (cycle.at)
     4. the individual evidence domains
   A stale outer envelope containing metrics:FRESH is NOT fresh. Those values were fresh when the
   projection was made and have been frozen ever since - which is exactly the wall-monitor defect
   (a LIVE badge over a 12d13.7h outage) reappearing one layer further out.

   Three words this panel will never print for an open incident: HEALTHY, ALL CLEAR, RESOLVED. */
function nfmEsc(v){
  return String(v==null?'':v).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function nfmIncidentState(feed, nowSec, bound){
  bound = (typeof bound==='number') ? bound : 90;   /* 3 producer cycles (30s) + transport */
  const R = o => Object.assign({show:true, status:'UNKNOWN', freshness:'UNKNOWN', tone:'warn',
                                feedAge:null, projAge:null, cycleAge:null, lastKnown:false,
                                incidentId:null, episode:null, lifecycleStatus:null,
                                viewStatus:null, cycleAt:null, completeness:null,
                                banner:null, reason:''}, o);
  const age = (iso) => {
    if(typeof iso!=='string' || !iso) return null;
    const t = Date.parse(iso);
    return isFinite(t) ? Math.max(0, nowSec - t/1000) : null;
  };

  if(!feed || typeof feed!=='object')
    return R({status:'FEED_UNAVAILABLE', freshness:'UNAVAILABLE', tone:'crit',
              banner:'INCIDENT FEED UNAVAILABLE', reason:'no feed'});
  if(feed.schema !== 'netframe-live-dashboard-feed/v1')
    return R({status:'UNSUPPORTED', freshness:'UNAVAILABLE', tone:'crit',
              banner:'UNSUPPORTED INCIDENT FEED',
              reason:'feed schema '+String(feed.schema)+' is not understood by this dashboard'});
  if(feed.status === 'FEED_UNAVAILABLE')
    return R({status:'FEED_UNAVAILABLE', freshness:'UNAVAILABLE', tone:'crit',
              banner:'INCIDENT FEED UNAVAILABLE', reason:String(feed.error||'feed not reachable')});
  if(feed.status === 'NO_SELECTION')
    /* NOT health. It means no operator pointed this surface at an incident. */
    return R({show:false, status:'NO_SELECTION', freshness:'UNKNOWN', tone:'dim',
              reason:'no incident selected for display'});

  const feedAge = age(feed.generated_at);
  const projAge = age(feed.state_generated_at);
  const st = (feed.state && typeof feed.state==='object') ? feed.state : null;
  const sel = (feed.selection && typeof feed.selection==='object') ? feed.selection : null;
  const cyc = (st && st.cycle && typeof st.cycle==='object') ? st.cycle : null;
  const cycleAge = cyc ? age(cyc.at) : null;
  const base = {
    feedAge:feedAge, projAge:projAge, cycleAge:cycleAge,
    incidentId: (st && st.subject && st.subject.incident_id) || (sel && sel.incident_id) || null,
    episode: (st && st.subject) ? st.subject.episode : null,
    lifecycleStatus: (st && st.lifecycle) ? st.lifecycle.status : null,
    viewStatus: st ? st.view_status : null,
    cycleAt: cyc ? cyc.at : null,
    completeness: cyc ? cyc.completeness : null,
    lastKnown: feed.status === 'PRODUCER_FAILED'
  };

  if(feedAge === null)
    return R(Object.assign({}, base, {status:feed.status, freshness:'UNKNOWN', tone:'warn',
      banner:'INCIDENT FEED AGE UNKNOWN', reason:'feed carries no usable generated_at'}));
  if(feedAge > bound)
    /* Precedence rule 1. Nothing inside can rescue this. */
    return R(Object.assign({}, base, {status:feed.status, freshness:'STALE', tone:'crit',
      banner:'INCIDENT FEED STALE',
      reason:'feed age '+Math.round(feedAge)+'s exceeds '+bound+'s'}));
  if(!st)
    return R(Object.assign({}, base, {status:feed.status, freshness:'UNAVAILABLE', tone:'crit',
      banner: feed.status==='PRODUCER_FAILED' ? 'INCIDENT PROJECTION UNAVAILABLE'
                                              : 'INCIDENT FEED CARRIES NO PROJECTION',
      reason:String(feed.error||'no projection in feed')}));
  if(st.schema !== 'netframe-live-incident/v1')
    return R(Object.assign({}, base, {status:'UNSUPPORTED', freshness:'UNAVAILABLE', tone:'crit',
      banner:'UNSUPPORTED INCIDENT FEED',
      reason:'projection schema '+String(st.schema)+' is not understood'}));

  /* Precedence rule 2/3: a carried projection ages on its OWN clock, never the envelope's. */
  const effAge = (base.lastKnown && projAge!==null) ? projAge
               : (projAge!==null ? projAge : cycleAge);
  if(effAge === null)
    return R(Object.assign({}, base, {status:feed.status, freshness:'UNKNOWN', tone:'warn',
      banner:'INCIDENT PROJECTION AGE UNKNOWN', reason:'projection carries no usable timestamp'}));
  if(effAge > bound)
    /* A stale carried projection must still say WHY the producer stopped: "old" and "old because
       Prometheus is unreachable" are different operator problems. */
    return R(Object.assign({}, base, {status:feed.status, freshness:'STALE', tone:'crit',
      banner: base.lastKnown ? 'INCIDENT PROJECTION LAST KNOWN' : 'INCIDENT PROJECTION STALE',
      reason:'projection age '+Math.round(effAge)+'s exceeds '+bound+'s'
             + (feed.error ? ' — '+String(feed.error) : '')}));
  if(base.lastKnown)
    return R(Object.assign({}, base, {status:feed.status, freshness:'STALE', tone:'warn',
      banner:'INCIDENT PROJECTION LAST KNOWN',
      reason:String(feed.error||'the last producer cycle failed')}));
  return R(Object.assign({}, base, {status:'OK', freshness:'FRESH',
    tone: nfmIncidentTone(base.viewStatus),
    reason:'projection current'}));
}

/* View status -> visual weight. There is NO green arm for an open incident, on purpose.
   OPEN_NO_CURRENT_SIGNAL means the record is open and nothing is currently firing; that is not
   health, and RECOVERY_SIGNALS is not a resolution. Only a CLOSED_RECORD is allowed to be quiet,
   and even then it is dim rather than green - the operator, not the estate, closed it. */
function nfmIncidentTone(viewStatus){
  if(viewStatus === 'CLOSED_RECORD')  return 'dim';
  if(viewStatus === 'ACTIVE')         return 'crit';
  return 'warn';
}

/* Evidence-domain freshness AFTER the outer projection has had its say (precedence rule 4).
   A domain that said FRESH inside a stale projection was fresh THEN. It is not fresh now. */
function nfmDomainState(domainStatus, projectionFreshness){
  const s = (typeof domainStatus === 'string' && domainStatus) ? domainStatus : 'UNKNOWN';
  if(projectionFreshness === 'FRESH') return s;
  if(s === 'FRESH') return 'STALE';
  return s === 'CURRENT-ONLY' ? 'STALE' : s;
}

function nfmIncidentPanel(feed, nowSec, bound){
  const d = nfmIncidentState(feed, nowSec, bound);
  if(!d.show) return '';
  const E = nfmEsc, A = (s)=> (s==null||!isFinite(s)) ? '?' : nfmAgeText(s);
  const st = (feed && feed.state) || null;
  const row = (label, body) => '<div class="irow"><span class="ilab">'+E(label)+'</span>'+body+'</div>';
  const pill = (txt, tone) => '<span class="ipill '+E(tone)+'">'+E(txt)+'</span>';
  let h = '';

  /* --- identity + projection truth ------------------------------------------------ */
  h += '<div class="ihead">'
     +   '<span class="ibadge '+E(d.tone)+'">INCIDENT</span>'
     +   '<span class="iid">'+E(d.incidentId || 'UNKNOWN')+'</span>'
     +   (d.episode!=null ? '<span class="idim">episode '+E(d.episode)+'</span>' : '')
     +   (d.lifecycleStatus ? pill('LIFECYCLE '+d.lifecycleStatus,
                                   d.lifecycleStatus==='RESOLVED'?'dim':'warn') : '')
     +   (d.viewStatus ? pill(d.viewStatus, d.tone) : '')
     +   (d.banner ? pill(d.banner, 'crit') : '')
     +   '<span class="iage">'+(d.freshness==='FRESH' ? 'PROJECTION FRESH · '
                                                      : 'PROJECTION '+E(d.freshness)+' · ')
     +   'cycle '+E(d.cycleAt||'UNKNOWN')+' · age '+E(A(d.cycleAge))+'</span>'
     + '</div>';
  if(d.freshness !== 'FRESH')
    h += '<div class="iwarn">'+E(d.banner||'PROJECTION NOT CURRENT')+' — '+E(d.reason)
       + '. Values below were true when the projection was made, not now.</div>';
  if(!st) return '<div class="ipanel '+E(d.tone)+'">'+h+'</div>';

  /* --- lifecycle + impact --------------------------------------------------------- */
  const lc = st.lifecycle || {};
  if(lc.resolution_recorded !== true && d.lifecycleStatus !== 'RESOLVED')
    h += row('LIFECYCLE', '<span>'+E(d.lifecycleStatus||'UNKNOWN')
           + ' · NO RESOLUTION EVENT RECORDED</span>');
  else if(d.lifecycleStatus === 'RESOLVED')
    h += row('LIFECYCLE', '<span>CLOSED RECORD · RESOLVED '
           + E((lc.events||[]).filter(e=>e.event==='RESOLVED').map(e=>e.at)[0] || 'UNKNOWN')
           + ' · DISPLAY SELECTION STILL ACTIVE</span>');

  const imp = st.impact || {};
  const rec = imp.recorded_affected_systems || [];
  h += row('IMPACT', rec.length ? rec.map(s=>pill(s,'warn')).join('')
                                : '<span class="idim">none recorded</span>');
  const ctx = imp.current_dependency_context || [];
  if(ctx.length)
    h += row('CURRENT CONTEXT',
             ctx.slice(0,6).map(c=>pill(c.of+' → '+c.domain,'dim')).join('')
             + '<span class="idim"> CURRENT-CONTEXT · does not rewrite recorded impact</span>');

  /* --- what changed --------------------------------------------------------------- */
  const tr = (st.changes_since_previous_cycle || []).filter(t=>t && t.kind!=='UNCHANGED');
  const reg = st.recovery_regressions || [];
  let chg = reg.map(r=>pill('RECOVERY REGRESSION '+r.identity,'crit')).join('');
  chg += tr.slice(0,6).map(t=>pill(t.kind+' '+t.identity
          + (t.kind==='CHANGED' ? ' '+t.from+'→'+t.to : ''),
          t.kind==='NEW'?'crit':(t.kind==='RECOVERED'?'ok':'warn'))).join('');
  h += row('WHAT CHANGED', chg || '<span class="idim">nothing changed this cycle</span>');

  /* --- current signals ------------------------------------------------------------ */
  const cov = st.evidence_coverage || {};
  let sig = ['metrics','alerts'].map(k=>{
    const e = cov[k];
    if(!e) return pill(k.toUpperCase()+' NOT MEASURED','dim');
    const s = nfmDomainState(e.status, d.freshness);
    return pill(k.toUpperCase()+' '+s+(e.age?' '+e.age:''), s==='FRESH'?'ok':'warn');
  }).join('');
  sig += (st.metrics||[]).filter(m=>m && m.verdict && m.verdict!=='EXCLUDED').slice(0,3)
          .map(m=>pill(m.host+' '+m.metric+' '+m.verdict,
                       m.verdict==='ELEVATED'?'crit':'dim')).join('');
  const firing = (st.alerts||[]).filter(a=>a && a.state==='firing' && a.relevant);
  sig += firing.slice(0,3).map(a=>pill('FIRING '+a.alertname,'crit')).join('');
  h += row('CURRENT SIGNALS', sig || '<span class="idim">NOT MEASURED</span>');

  /* --- correlation ---------------------------------------------------------------- */
  const c = st.correlation || null;
  if(!c) h += row('CORRELATION','<span class="idim">UNAVAILABLE</span>');
  else {
    let cb = pill('ASSESSMENT '+(c.assessment||'UNKNOWN'),'warn')
           + pill('HYPOTHESIS '+((c.hypotheses||[])[0]||'NO_HYPOTHESIS'),'dim')
           + pill('CAUSATION '+(c.causation||'NOT_PROVEN'),
                  c.causation==='PROVEN_BY_SOURCE'?'warn':'dim');
    (c.contradicting_evidence||[]).slice(0,2)
      .forEach(e=>{ cb += '<span class="ictr">CONTRADICTS '+E(e.statement)+'</span>'; });
    h += row('CORRELATION', cb);
  }

  /* --- recovery ------------------------------------------------------------------- */
  const rs = st.recovery_signals || [];
  if(rs.length)
    h += row('RECOVERY', rs.slice(0,3).map(s=>pill(s.signal,'ok')).join('')
           + '<span class="ircv">RECOVERY SIGNALS PRESENT · INCIDENT STATUS '
           + E(d.lifecycleStatus||'OPEN')
           + ' · OWNER HAS NOT RECORDED RESOLVED</span>');

  /* --- pending capture ------------------------------------------------------------ */
  const pc = st.pending_captures || [];
  if(pc.length)
    h += row('CAPTURE', pill('PENDING CAPTURE '+pc.length,'warn')
           + '<span class="idim">operator publishes; the wall never does</span>');

  /* --- next investigation + authority --------------------------------------------- */
  const ni = st.next_investigation || null;
  h += row('NEXT INVESTIGATION',
           ni && ni.action
             ? '<span class="inext">'+E(ni.action)+'</span>'
               + pill(ni.executed===true ? 'EXECUTED' : 'NOT EXECUTED',
                      ni.executed===true ? 'crit' : 'dim')
               + pill('OWNER ACTION REQUIRED','dim')
             : '<span class="idim">UNKNOWN</span>');
  const au = st.authority || {};
  h += '<div class="iauth">ADVISORY · MAX_AUTO_CLASS '
     + E(au.max_auto_class==null ? 'UNKNOWN' : au.max_auto_class)
     + ' · the wall performs no remediation</div>';
  return '<div class="ipanel '+E(d.tone)+'">'+h+'</div>';
}
/* NFM-INCIDENT-PANEL-END */

/* NFM-PROPOSAL-PANEL-BEGIN  (pure; offline-tested by tests/test_p5_proposals.mjs - keep in sync)
   AWARENESS, NOT AUTHORITY. This tells an operator that Jarvis has prepared something needing
   review. It cannot accept, dismiss, publish, select or remediate, and there is deliberately no
   control of any kind below - the CLI remains the review surface.

   A PROPOSAL IS NOT AN INCIDENT. It will never render INCIDENT DETECTED, INCIDENT ACTIVE or
   OUTAGE because one exists, and a proposal whose source alert CLEARED is not a resolved
   incident - it is a condition that ended before anyone decided whether it deserved a record,
   and it still awaits an owner.

   FRESHNESS PRECEDENCE, the same discipline as the incident panel one layer out:
     1. this projection's own age (generated_at)
     2. the intake collector's observation age/status, which NetFRAME already classified
     3. the individual proposal's own timestamps
   A count is a claim only when the collector could see. Zero proposals from an unavailable or
   stale source is not zero - it is UNKNOWN, and saying "0" there is the frozen-wall failure
   wearing a different hat. */
function nfmProposalState(feed, nowSec, bound){
  bound = (typeof bound==='number') ? bound : 120;   /* ~4 producer cycles at 31s */
  const R = o => Object.assign({show:false, status:'UNKNOWN', tone:'dim', awaiting:null,
                                firing:null, cleared:null, detections:null, feedAge:null,
                                collector:'UNKNOWN', collectorAge:null, proposals:[], more:0,
                                banner:null, reason:''}, o);
  const age = (iso) => {
    if(typeof iso!=='string' || !iso) return null;
    const t = Date.parse(iso);
    return isFinite(t) ? Math.max(0, nowSec - t/1000) : null;
  };

  if(!feed || typeof feed!=='object')
    return R({show:true, status:'FEED_UNAVAILABLE', tone:'warn',
              banner:'PROPOSAL FEED UNAVAILABLE', reason:'no feed'});
  if(feed.status === 'FEED_UNAVAILABLE')
    return R({show:true, status:'FEED_UNAVAILABLE', tone:'warn',
              banner:'PROPOSAL FEED UNAVAILABLE',
              reason:String(feed.error||'projection not reachable')});
  if(feed.schema !== 'netframe-proposal-dashboard-feed/v2')
    return R({show:true, status:'UNSUPPORTED', tone:'warn',
              banner:'UNSUPPORTED PROPOSAL FEED',
              reason:'feed schema '+String(feed.schema)+' is not understood'});

  const feedAge = age(feed.generated_at);
  const coll = (feed.collector && typeof feed.collector==='object') ? feed.collector : {};
  const summary = (feed.summary && typeof feed.summary==='object') ? feed.summary : {};
  const list = Array.isArray(feed.proposals) ? feed.proposals : [];
  const base = {feedAge:feedAge, collector:String(coll.status||'UNKNOWN'),
                collectorAge:(typeof coll.age_seconds==='number') ? coll.age_seconds : null,
                proposals:list, more:(typeof feed.more_not_shown==='number')
                                     ? feed.more_not_shown : 0};

  /* Precedence 1: a projection older than the bound cannot describe now. */
  if(feedAge === null)
    return R(Object.assign({}, base, {show:true, status:'STALE', tone:'warn',
      banner:'PROPOSAL FEED AGE UNKNOWN', reason:'feed carries no usable generated_at'}));
  if(feedAge > bound)
    return R(Object.assign({}, base, {show:true, status:'STALE', tone:'warn',
      banner:'PROPOSAL FEED STALE',
      reason:'feed age '+Math.round(feedAge)+'s exceeds '+bound+'s'}));

  /* Precedence 2: NetFRAME already classified the collector. A fresh envelope carrying an
     unavailable or stale observation is not a current count. */
  if(coll.status === 'UNAVAILABLE' || coll.status === 'UNKNOWN')
    return R(Object.assign({}, base, {show:true, status:'INTAKE_UNAVAILABLE', tone:'warn',
      banner:'INTAKE SOURCE UNAVAILABLE',
      reason:String(coll.reason||'the intake collector could not read its source')}));
  if(coll.status === 'STALE')
    return R(Object.assign({}, base, {show:true, status:'INTAKE_STALE', tone:'warn',
      banner:'PROPOSAL INTAKE STALE',
      reason:String(coll.reason||'the last intake observation is old')}));
  if(summary.counts_are_authoritative !== true)
    return R(Object.assign({}, base, {show:true, status:'INTAKE_UNAVAILABLE', tone:'warn',
      banner:'INTAKE SOURCE UNAVAILABLE',
      reason:'the producer did not mark these counts authoritative'}));

  const awaiting = (typeof summary.awaiting_owner_review==='number')
                   ? summary.awaiting_owner_review : null;
  if(awaiting === null)
    return R(Object.assign({}, base, {show:true, status:'INTAKE_UNAVAILABLE', tone:'warn',
      banner:'INTAKE SOURCE UNAVAILABLE', reason:'no count was supplied'}));
  /* THE HEADLINE IS WORK, NOT OBJECTS. awaiting_owner_review counts every retained proposal,
     including alerts that cleared before anyone looked; on 2026-09-09 that read 27 while nothing
     needed a person. owner_action_required is the count that decides whether to walk over. A feed
     that predates the field falls back to the old number rather than silently reading zero. */
  const action = (typeof summary.owner_action_required==='number')
                 ? summary.owner_action_required : awaiting;
  const history = (typeof summary.resolved_history==='number') ? summary.resolved_history : null;
  const security = (typeof summary.security_pending==='number') ? summary.security_pending : null;
  return R(Object.assign({}, base, {
    show: action > 0 || (history || 0) > 0, status:'OK',
    tone: security > 0 ? 'crit' : (action > 0 ? 'warn' : 'dim'),
    awaiting: awaiting, action: action, history: history, security: security,
    firing: (typeof summary.pending_firing==='number') ? summary.pending_firing : null,
    cleared:(typeof summary.pending_cleared==='number') ? summary.pending_cleared : null,
    detections:(typeof summary.pending_detections==='number') ? summary.pending_detections : null,
    reason: action > 0 ? 'owner action required'
                       : 'no owner action required'}));
}

function nfmProposalPanel(feed, nowSec, bound){
  const d = nfmProposalState(feed, nowSec, bound);
  if(!d.show) return '';
  const E = nfmEsc;
  const pill = (t, tone) => '<span class="ppill '+E(tone)+'">'+E(t)+'</span>';
  let h = '<div class="phead">'
        +   '<span class="pbadge '+E(d.tone)+'">INCIDENT PROPOSALS</span>';
  if(d.banner){
    /* An empty local list under a broken source must never read as zero. */
    h += pill(d.banner, 'warn')
       + '<span class="pdim">'+E(d.reason)+'</span>';
  } else {
    /* Security first, then live operational, then history - and history is always dim, so it
       cannot compete with a detection for the operator's eye. */
    h += '<span class="pcount">'+E(d.action)+' OWNER ACTION REQUIRED</span>'
       + (d.security ? pill(d.security+' SECURITY DETECTION','crit') : '')
       + (d.firing ? pill(d.firing+' SOURCE STILL FIRING','crit') : '')
       + (d.detections && !d.security ? pill(d.detections+' WAZUH DETECTION','crit') : '')
       + (d.action === 0 ? pill('NONE PENDING','dim') : '')
       + ((d.history || d.cleared)
            ? pill((d.history !== null ? d.history : d.cleared)+' RESOLVED / HISTORY','dim') : '');
  }
  h += '<span class="pauth">OWNER REVIEW REQUIRED · MAX_AUTO_CLASS 0</span></div>';

  /* The typed condition decides the wording. A Wazuh archive event is never FIRING and never
     CLEARED - it happened once and does not un-happen - so it gets its own label rather than
     borrowing an alert's lifecycle. Anything unrecognised renders as the raw enum, not as a
     guess. */
  const CONDITION = {FIRING:'SOURCE STILL FIRING', CLEARED:'SOURCE ALERT CLEARED',
                     DETECTION_RECORDED:'DETECTION RECORDED'};
  (d.proposals||[]).forEach(p => {
    if(!p || typeof p!=='object') return;
    const cond = String(p.source_condition||'UNKNOWN');
    const cleared = cond === 'CLEARED';
    const detection = cond === 'DETECTION_RECORDED';
    h += '<div class="prow">'
       +   '<span class="pid">'+E(p.proposal_id)+'</span>'
       +   '<span class="palert">'+E(p.title)+'</span>'
       +   pill(p.source_kind||'unknown', 'dim')   /* pill() escapes; escaping here too would render the escape sequences */
       +   pill(CONDITION[cond] || cond, cleared ? 'dim' : 'crit')
       +   (p.detail ? pill(p.detail, 'dim') : '')
       +   pill(p.proposal_state, 'warn')
       +   (p.suggested_event ? pill('SUGGESTS '+p.suggested_event, 'dim') : '')
       +   ((p.suggested_affected_systems||[]).length
              ? pill((p.suggested_affected_systems||[]).join(', '), 'dim') : '')
       +   (p.possible_existing_incident_count
              ? pill(p.possible_existing_incident_count+' POSSIBLE EXISTING INCIDENTS','dim') : '')
       +   '<span class="page">'+E(nfmAgeText(p.age_seconds))+'</span>'
       + '</div>';
    if(cleared)
      h += '<div class="pnote">source alert cleared before review; the proposal still awaits an '
         + 'owner decision and no incident was resolved</div>';
    if(detection)
      h += '<div class="pnote">a security detection was recorded; it is not proof of breach or '
         + 'compromise, and the rule level is Wazuh\'s own scale, not a NetFRAME severity</div>';
  });
  if(d.more) h += '<div class="pnote">+ '+E(d.more)+' MORE NOT SHOWN</div>';
  h += '<div class="pfoot">a proposal is not an incident; review with '
     + '<code>netframe incident proposals</code></div>';
  return '<div class="ppanel '+E(d.tone)+'">'+h+'</div>';
}
/* NFM-PROPOSAL-PANEL-END */

function updateMode(ds, s){
  const b=el('modebadge'); if(!b) return;
  const worst=(names)=>{ if(!s||!s.panels||!names.length) return null;
    let w=null; for(const n of names){ const a=s.panels[n]?s.panels[n].age:null;
      if(a==null) return null; if(w===null||a>w) w=a; } return w; };
  if(ds.state==='LIVE'){ b.className='badge ok'; b.innerHTML='<span class="dot g"></span>LIVE'; return; }
  if(ds.state==='DEGRADED'){
    const w=worst(ds.stale);
    b.className='badge warn';
    b.innerHTML='<span class="dot y"></span>DEGRADED · '+ds.stale.join(' ').toUpperCase()+' '+nfmAgeText(w);
    return; }
  if(ds.state==='STALE'){
    b.className='badge crit';
    b.innerHTML='<span class="dot r"></span>STALE '+nfmAgeText(ds.age); return; }
  if(ds.state==='OFFLINE'){
    b.className='badge crit'; b.innerHTML='<span class="dot r"></span>OFFLINE'; return; }
  b.className='badge warn'; b.innerHTML='<span class="dot y"></span>UNKNOWN';
}
function mergeGpus(cur,live){
  return cur.map(g=>{ if(g.planned) return g;
    const L=live.find(x=>x.host===g.host); if(!L) return g;
    return {...g,card:L.card,temps:L.temps,util:L.util,vramU:L.vramU,vram:L.vram,
            watts:(L.watts!=null?L.watts:g.watts)}; });
}
function applyLive(s){
  if(s.nodes){DATA.nodes.forEach(n=>{const L=s.nodes[n.host]; if(!L) return;
    if(L.cpu!=null)n.cpu=L.cpu; if(L.ramU!=null)n.ramU=L.ramU; if(L.disk!=null)n.disk=L.disk;
    if(L.st)n.st=L.st; if(L.gpu&&n.gpu)Object.assign(n.gpu,L.gpu);});}
  if(s.ups){DATA.ups.forEach(u=>{const k=u.name.indexOf('Middle')>=0?'midatlantic':'tripplite';
    const L=s.ups[k]; if(!L) return;
    if(L.load!=null)u.load=L.load; if(L.batt!=null)u.batt=L.batt; if(L.runtime!=null)u.runtime=L.runtime;});}
  if(s.integrity)DATA.integrity=s.integrity;
  if(s.services)DATA.services=s.services;
  if(s.gpus)DATA.gpus=mergeGpus(DATA.gpus,s.gpus);
  if(s.slurm){const L=s.slurm;
    if(L.running)DATA.slurm.running=L.running;
    if(L.pending)DATA.slurm.pending=L.pending;
    if(L.partitions)DATA.slurm.partitions=L.partitions;
    if(L.node)DATA.slurm.node=L.node;}
  if(s.k8s)Object.assign(DATA.k8s,s.k8s);
  if(s.pihole){const p=s.pihole; // reflect DNS up/down onto the Pi-hole service dots
    DATA.services.forEach(sv=>{ if(sv.n==='Pi-hole (pri)'&&p.primary!=null)sv.s=p.primary?'g':'r';
      if(sv.n==='Pi-hole (sec)'&&p.secondary!=null)sv.s=p.secondary?'g':'r';});}
  if(s.pihole_stats){const p=s.pihole_stats;
    if(p.blocked!=null)DATA.pihole.blocked=p.blocked;
    if(p.total!=null)DATA.pihole.total=p.total;
    if(p.qpm!=null)DATA.pihole.qpm=p.qpm;}
  if(s.opnsense){const o=s.opnsense;
    ['wan1','wan2'].forEach(k=>{const L=o[k],w=DATA.opnsense[k]; if(!L||!w)return;
      if(L.state)w.state=L.state;
      if(L.down_bps!=null){WANHIST[k].push(L.down_bps);while(WANHIST[k].length>16)WANHIST[k].shift();
        const m=Math.max(1,...WANHIST[k]); w.down=WANHIST[k].map(v=>v/m*100); w.mbps=L.down_bps/1e6;}
      if(L.up_bps!=null)w.upMbps=L.up_bps/1e6;
      if(L.gw!==undefined){w.gw=L.gw;w.lat=L.lat;w.loss=L.loss;}});
    if(o.states!=null)DATA.opnsense.states=o.states;}
  if(s.network){const n=s.network,d=DATA.network;
    if(n.up!=null)d.up=n.up; if(n.ports!=null)d.ports=n.ports; if(n.tenG!=null)d.tenG=n.tenG;
    if(n.in_mbps!=null)d.inMbps=n.in_mbps; if(n.out_mbps!=null)d.outMbps=n.out_mbps;}
}
const WANHIST={wan1:[],wan2:[]};
async function pull(){
  try{
    const r=await fetch('/api/state',{cache:'no-store'});
    if(!r.ok) throw 0;
    const s=await r.json();
    if(!s) throw 0;
    // s.ok is NOT a health signal: it is sources.prometheus||sources.monitor, and carry() holds
    // those true on carried data. The snapshot is rendered and JUDGED on its own declared state.
    const ds = nfmDisplayState(s, Date.now()/1000);
    applyLive(s); updateMode(ds, s); renderAll();
  }catch(e){
    updateMode({state:'OFFLINE',age:null,stale:[],reason:'fetch failed'}, null); mockTick();
  }
}

/* The incident panel is polled SEPARATELY and its failures are caught SEPARATELY. An
   unreachable incident feed must degrade one strip, never the operations wall: the base dashboard
   predates this feature and has to keep working without it. */
async function pullIncident(){
  let feed = null;
  try{
    const r = await fetch('/api/incident',{cache:'no-store'});
    if(r.ok) feed = await r.json();
  }catch(e){ feed = null; }
  try{
    const host = el('incident'); if(!host) return;
    const html = nfmIncidentPanel(feed, Date.now()/1000);
    host.innerHTML = html;
    host.className = html ? 'on' : '';
  }catch(e){ /* a renderer fault must not stop the clock or the operations pull */ }
}

/* Polled separately, caught separately. An unreachable proposal projection degrades one strip
   and cannot touch /api/state, /api/incident or the live incident panel. */
async function pullProposals(){
  let feed = null;
  try{
    const r = await fetch('/api/proposals',{cache:'no-store'});
    if(r.ok) feed = await r.json();
  }catch(e){ feed = null; }
  try{
    const host = el('proposals'); if(!host) return;
    const html = nfmProposalPanel(feed, Date.now()/1000);
    host.innerHTML = html;
    host.className = html ? 'on' : '';
  }catch(e){ /* a renderer fault must not stop the clock or the operations pull */ }
}

/* boot */
renderAll();renderClock();fit();
setInterval(renderClock,1000);
pull(); setInterval(pull,3000);
pullIncident(); setInterval(pullIncident,5000);
pullProposals(); setInterval(pullProposals,5000);
</script>
