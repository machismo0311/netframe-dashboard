<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- Reproduce the wall Pi's fonts for layout tests: no Rajdhani or Share Tech Mono is installed
       there, so the display stack falls to sans-serif = DejaVu Sans (fc-match on the Pi, 2026-10-07)
       and the mono stack to DejaVu Sans Mono. Measuring with another sans hides overflow. -->
  <alias binding="strong"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <match target="pattern"><test name="family"><string>Noto Sans</string></test><edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit></match>
</fontconfig>
